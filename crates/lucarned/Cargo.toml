[package]
name = "lucarned"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-process lucarne daemon composition root."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
default = []
memory-profiling = ["lucarne/memory-profiling"]
remote-access = ["dep:lucarne-remote"]
terminal-rmux = ["dep:lucarne-rmux"]
terminal-gateway = [
    "remote-access",
    "terminal-rmux",
    "dep:lucarne-termgw",
    "lucarne/terminal-agent-bind",
    "reqwest/blocking",
]
tui = [
    "terminal-gateway",
    "dep:ratatui",
    "dep:crossterm",
    "dep:qrcode",
]
product-terminal = ["terminal-gateway", "tui"]

[[bin]]
name = "lucarned"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
lucarne = { path = "../lucarne" }
lucarned-ctl = { path = "../lucarned-ctl", features = ["updates"] }
lucarne-adapter = { path = "../lucarne-adapter" }
lucarne-telegram = { path = "../lucarne-telegram" }
lucarne-wechat = { path = "../lucarne-wechat" }
lucarne-remote = { path = "../lucarne-remote", optional = true }
lucarne-termgw = { path = "../lucarne-termgw", optional = true }
lucarne-rmux = { path = "../lucarne-rmux", optional = true }
axum = { workspace = true }
# ratatui 0.30 ships the crossterm 0.29 backend by default, so the two stay on
# one crossterm major.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
dotenvy = "0.15"

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.dist]
features = ["product-terminal"]
